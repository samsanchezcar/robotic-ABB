<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 4800" width="1200" height="4800">
  <defs>
    <style>
      .box { fill: #111113; stroke: #FFFFFF; stroke-width: 2; }
      .decision { fill: #111113; stroke: #FFFFFF; stroke-width: 2; }
      .text { fill: #e0dfdf; font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .line { stroke: #cccccc; stroke-width: 2; fill: none; }
      .arrow { fill: #cccccc; }
      .cluster { fill: none; stroke: #BDBCCC; stroke-width: 2; stroke-dasharray: 5,5; }
      .cluster-text { fill: #e0dfdf; font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" class="arrow"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="4800" fill="#171719"/>
  
  <!-- Title -->
  <text x="600" y="30" class="text" font-size="18" font-weight="bold">RAPID Robot Cake Decoration Routine</text>
  
  <!-- Start -->
  <ellipse cx="600" cy="80" rx="50" ry="30" class="box"/>
  <text x="600" y="85" class="text">Start</text>
  
  <!-- Initialize -->
  <rect x="450" y="140" width="300" height="60" rx="5" class="box"/>
  <text x="600" y="165" class="text">Initialize outputs OFF</text>
  <text x="600" y="185" class="text">(DO_01=0, Conveyor OFF)</text>
  
  <!-- Set Cake -->
  <rect x="450" y="230" width="300" height="40" rx="5" class="box"/>
  <text x="600" y="255" class="text">Set Current_Wobj = Cake</text>
  
  <!-- P_Home0 -->
  <rect x="520" y="300" width="160" height="40" rx="5" class="box"/>
  <text x="600" y="325" class="text">Go Home (P_Home)</text>
  
  <!-- Wait for Input -->
  <path d="M 520,380 L 680,380 L 700,400 L 700,420 L 680,440 L 520,440 L 500,420 L 500,400 Z" class="box"/>
  <text x="600" y="415" class="text">Wait for user Input</text>
  
  <!-- Decision 1: DI_01? -->
  <path d="M 600,500 L 750,650 L 600,800 L 450,650 Z" class="decision"/>
  <text x="600" y="645" class="text">Digital Input 1 ON?</text>
  <text x="600" y="665" class="text">(DI_01==1)</text>
  
  <!-- YES path -->
  <text x="350" y="750" class="text" font-weight="bold">YES</text>
  
  <!-- Set Current_Wobj = Cake -->
  <rect x="100" y="830" width="300" height="40" rx="5" class="box"/>
  <text x="250" y="855" class="text">Set Current_Wobj = Cake</text>
  
  <!-- Set DO_01 -->
  <rect x="100" y="900" width="300" height="40" rx="5" class="box"/>
  <text x="250" y="925" class="text">Set Digital Output 1 (DO_01=1)</text>
  
  <!-- Go Home 1 -->
  <rect x="170" y="970" width="160" height="40" rx="5" class="box"/>
  <text x="250" y="995" class="text">Go Home</text>
  
  <!-- Conveyor Forward 1 -->
  <rect x="100" y="1040" width="300" height="60" rx="5" class="box"/>
  <text x="250" y="1065" class="text">Set Conveyor Forward</text>
  <text x="250" y="1085" class="text">(Conveyor_FWD=1)</text>
  
  <!-- Wait 4.2s -->
  <rect x="150" y="1130" width="200" height="40" rx="5" class="box"/>
  <text x="250" y="1155" class="text">Wait 4.2 Seconds</text>
  
  <!-- Conveyor Stop 1 -->
  <rect x="100" y="1200" width="300" height="60" rx="5" class="box"/>
  <text x="250" y="1225" class="text">Reset Conveyor Forward</text>
  <text x="250" y="1245" class="text">(Conveyor_FWD=0)</text>
  
  <!-- Decoration routine cluster -->
  <rect x="80" y="1290" width="340" height="560" class="cluster"/>
  <text x="250" y="1315" class="cluster-text">Decoration Routine (MARK)</text>
  
  <!-- Go Home 2 -->
  <rect x="170" y="1340" width="160" height="40" rx="5" class="box"/>
  <text x="250" y="1365" class="text">Go Home</text>
  
  <!-- Local Home 1 -->
  <rect x="150" y="1410" width="200" height="40" rx="5" class="box"/>
  <text x="250" y="1435" class="text">Go to Local Home</text>
  
  <!-- Execute Batman Path -->
  <path d="M 130,1480 L 370,1480 L 380,1490 L 380,1510 L 370,1520 L 130,1520 L 120,1510 L 120,1490 Z" class="box"/>
  <text x="250" y="1505" class="text">Execute Batman Path</text>
  
  <!-- Local Home 2 -->
  <rect x="150" y="1550" width="200" height="40" rx="5" class="box"/>
  <text x="250" y="1575" class="text">Go to Local Home</text>
  
  <!-- Execute Names Path -->
  <path d="M 130,1620 L 370,1620 L 380,1630 L 380,1650 L 370,1660 L 130,1660 L 120,1650 L 120,1630 Z" class="box"/>
  <text x="250" y="1645" class="text">Execute Names Path</text>
  
  <!-- Local Home 3 -->
  <rect x="150" y="1690" width="200" height="40" rx="5" class="box"/>
  <text x="250" y="1715" class="text">Go to Local Home</text>
  
  <!-- Go Home 3 -->
  <rect x="170" y="1760" width="160" height="40" rx="5" class="box"/>
  <text x="250" y="1785" class="text">Go Home</text>
  
  <!-- Wait 2s -->
  <rect x="160" y="1880" width="180" height="40" rx="5" class="box"/>
  <text x="250" y="1905" class="text">Wait 2 seconds</text>
  
  <!-- Conveyor Forward 2 -->
  <rect x="100" y="1950" width="300" height="60" rx="5" class="box"/>
  <text x="250" y="1975" class="text">Set Conveyor Forward</text>
  <text x="250" y="1995" class="text">(Conveyor_FWD=1)</text>
  
  <!-- Wait 4.2s #2 -->
  <rect x="150" y="2040" width="200" height="40" rx="5" class="box"/>
  <text x="250" y="2065" class="text">Wait 4.2 Seconds</text>
  
  <!-- Conveyor Stop 2 -->
  <rect x="100" y="2110" width="300" height="60" rx="5" class="box"/>
  <text x="250" y="2135" class="text">Reset Conveyor Forward</text>
  <text x="250" y="2155" class="text">(Conveyor_FWD=0)</text>
  
  <!-- Wait 2s #2 -->
  <rect x="160" y="2200" width="180" height="40" rx="5" class="box"/>
  <text x="250" y="2225" class="text">Wait 2 seconds</text>
  
  <!-- Reset DO_01 -->
  <rect x="100" y="2270" width="300" height="40" rx="5" class="box"/>
  <text x="250" y="2295" class="text">Reset Digital Output 1 (DO_01=0)</text>
  
  <!-- Conveyor Inverse -->
  <rect x="80" y="2340" width="340" height="60" rx="5" class="box"/>
  <text x="250" y="2365" class="text">Set Inverse Conveyor</text>
  <text x="250" y="2385" class="text">(Conveyor_INV=1)</text>
  
  <!-- Wait 8.5s -->
  <rect x="150" y="2430" width="200" height="40" rx="5" class="box"/>
  <text x="250" y="2455" class="text">Wait 8.5 seconds</text>
  
  <!-- Conveyor Inverse Stop -->
  <rect x="80" y="2500" width="340" height="60" rx="5" class="box"/>
  <text x="250" y="2525" class="text">Reset Inverse Conveyor</text>
  <text x="250" y="2545" class="text">(Conveyor_INV=0)</text>
  
  <!-- Set Cake2 -->
  <rect x="80" y="2590" width="340" height="60" rx="5" class="box"/>
  <text x="250" y="2615" class="text">Set Current_Wobj = Cake2</text>
  <text x="250" y="2635" class="text">(For Simulation)</text>
  
  <!-- Wait 1s -->
  <rect x="160" y="2680" width="180" height="40" rx="5" class="box"/>
  <text x="250" y="2705" class="text">Wait 1 second</text>
  
  <!-- MARK #2 -->
  <path d="M 120,2750 L 380,2750 L 390,2760 L 390,2780 L 380,2790 L 120,2790 L 110,2780 L 110,2760 Z" class="box"/>
  <text x="250" y="2775" class="text">Execute MARK Routine #2</text>
  
  <!-- Wait 1s #2 -->
  <rect x="160" y="2820" width="180" height="40" rx="5" class="box"/>
  <text x="250" y="2845" class="text">Wait 1 second</text>
  
  <!-- NO path - Decision 2 -->
  <text x="800" y="750" class="text" font-weight="bold">NO</text>
  
  <!-- Decision 2: DI_02? -->
  <path d="M 950,850 L 1100,1000 L 950,1150 L 800,1000 Z" class="decision"/>
  <text x="950" y="995" class="text">Digital Input 2 ON?</text>
  <text x="950" y="1015" class="text">(DI_02==1)</text>
  
  <!-- YES path DI_02 -->
  <text x="700" y="1050" class="text" font-weight="bold">YES</text>
  
  <!-- Set DO_02 -->
  <rect x="550" y="1180" width="300" height="40" rx="5" class="box"/>
  <text x="700" y="1205" class="text">Set Digital Output 2 (DO_02=1)</text>
  
  <!-- Go Home -->
  <rect x="620" y="1250" width="160" height="40" rx="5" class="box"/>
  <text x="700" y="1275" class="text">Go Home</text>
  
  <!-- Wait 1s -->
  <rect x="610" y="1320" width="180" height="40" rx="5" class="box"/>
  <text x="700" y="1345" class="text">Wait 1 second</text>
  
  <!-- Reset DO_02 -->
  <rect x="550" y="1390" width="300" height="40" rx="5" class="box"/>
  <text x="700" y="1415" class="text">Reset Digital Output 2 (DO_02=0)</text>
  
  <!-- NO path - Decision 3 -->
  <text x="1100" y="1050" class="text" font-weight="bold">NO</text>
  
  <!-- Decision 3: DI_03? -->
  <path d="M 950,1650 L 1100,1800 L 950,1950 L 800,1800 Z" class="decision"/>
  <text x="950" y="1795" class="text">Digital Input 3 ON?</text>
  <text x="950" y="1815" class="text">(DI_03==1)</text>
  
  <!-- YES path DI_03 -->
  <text x="1000" y="1880" class="text" font-weight="bold">YES</text>
  
  <!-- Set DO_03 -->
  <rect x="800" y="1980" width="300" height="40" rx="5" class="box"/>
  <text x="950" y="2005" class="text">Set Digital Output 3 (DO_03=1)</text>
  
  <!-- Go to Maintenance -->
  <rect x="800" y="2050" width="300" height="40" rx="5" class="box"/>
  <text x="950" y="2075" class="text">Go to Maintenance Position</text>
  
  <!-- Wait 1s -->
  <rect x="860" y="2120" width="180" height="40" rx="5" class="box"/>
  <text x="950" y="2145" class="text">Wait 1 second</text>
  
  <!-- Reset DO_03 -->
  <rect x="800" y="2190" width="300" height="40" rx="5" class="box"/>
  <text x="950" y="2215" class="text">Reset Digital Output 3 (DO_03=0)</text>
  
  <!-- Arrows -->
  <!-- Start to Initialize -->
  <line x1="600" y1="110" x2="600" y2="140" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Initialize to Set Cake -->
  <line x1="600" y1="200" x2="600" y2="230" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Set Cake to P_Home -->
  <line x1="600" y1="270" x2="600" y2="300" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- P_Home to Wait -->
  <line x1="600" y1="340" x2="600" y2="380" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Wait to Decision 1 -->
  <line x1="600" y1="440" x2="600" y2="500" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Decision 1 YES to Set Cake -->
  <line x1="450" y1="650" x2="250" y2="650" class="line"/>
  <line x1="250" y1="650" x2="250" y2="830" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Set Cake to Set DO_01 -->
  <line x1="250" y1="870" x2="250" y2="900" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Set DO_01 to Go Home -->
  <line x1="250" y1="940" x2="250" y2="970" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Go Home to Conveyor -->
  <line x1="250" y1="1010" x2="250" y2="1040" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Conveyor to Wait -->
  <line x1="250" y1="1100" x2="250" y2="1130" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Wait to Conveyor Stop -->
  <line x1="250" y1="1170" x2="250" y2="1200" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Conveyor Stop to Go Home 2 -->
  <line x1="250" y1="1260" x2="250" y2="1340" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Go Home 2 to Local Home 1 -->
  <line x1="250" y1="1380" x2="250" y2="1410" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Local Home 1 to Batman -->
  <line x1="250" y1="1450" x2="250" y2="1480" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Batman to Local Home 2 -->
  <line x1="250" y1="1520" x2="250" y2="1550" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Local Home 2 to Names -->
  <line x1="250" y1="1590" x2="250" y2="1620" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Names to Local Home 3 -->
  <line x1="250" y1="1660" x2="250" y2="1690" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Local Home 3 to Go Home 3 -->
  <line x1="250" y1="1730" x2="250" y2="1760" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Go Home 3 to Wait 2s -->
  <line x1="250" y1="1800" x2="250" y2="1880" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Wait 2s to Conveyor 2 -->
  <line x1="250" y1="1920" x2="250" y2="1950" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Conveyor 2 to Wait 4.2s -->
  <line x1="250" y1="2010" x2="250" y2="2040" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Wait 4.2s to Stop 2 -->
  <line x1="250" y1="2080" x2="250" y2="2110" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Stop 2 to Wait 2s -->
  <line x1="250" y1="2170" x2="250" y2="2200" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Wait 2s to Reset DO -->
  <line x1="250" y1="2240" x2="250" y2="2270" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Reset DO to Conv Inv -->
  <line x1="250" y1="2310" x2="250" y2="2340" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Conv Inv to Wait 8.5s -->
  <line x1="250" y1="2400" x2="250" y2="2430" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Wait 8.5s to Stop Inv -->
  <line x1="250" y1="2470" x2="250" y2="2500" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Stop Inv to Set Cake2 -->
  <line x1="250" y1="2560" x2="250" y2="2590" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Set Cake2 to Wait 1s -->
  <line x1="250" y1="2650" x2="250" y2="2680" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Wait 1s to MARK #2 -->
  <line x1="250" y1="2720" x2="250" y2="2750" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- MARK #2 to Wait 1s -->
  <line x1="250" y1="2790" x2="250" y2="2820" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Wait 1s to loop back -->
  <line x1="250" y1="2860" x2="250" y2="2950" class="line"/>
  <line x1="250" y1="2950" x2="1150" y2="2950" class="line"/>
  <line x1="1150" y1="2950" x2="1150" y2="410" class="line"/>
  <line x1="1150" y1="410" x2="700" y2="410" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Decision 1 NO to Decision 2 -->
  <line x1="750" y1="650" x2="950" y2="650" class="line"/>
  <line x1="950" y1="650" x2="950" y2="850" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Decision 2 YES to Set DO_02 -->
  <line x1="800" y1="1000" x2="700" y2="1000" class="line"/>
  <line x1="700" y1="1000" x2="700" y2="1180" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Set DO_02 to Go Home -->
  <line x1="700" y1="1220" x2="700" y2="1250" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Go Home to Wait 1s -->
  <line x1="700" y1="1290" x2="700" y2="1320" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Wait 1s to Reset DO_02 -->
  <line x1="700" y1="1360" x2="700" y2="1390" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Reset DO_02 to loop back -->
  <line x1="700" y1="1430" x2="700" y2="1500" class="line"/>
  <line x1="700" y1="1500" x2="1150" y2="1500" class="line"/>
  <line x1="1150" y1="1500" x2="1150" y2="410" class="line"/>
  
  <!-- Decision 2 NO to Decision 3 -->
  <line x1="1100" y1="1000" x2="1150" y2="1000" class="line"/>
  <line x1="1150" y1="1000" x2="1150" y2="1800" class="line"/>
  <line x1="1150" y1="1800" x2="1100" y2="1800" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Decision 3 YES to Set DO_03 -->
  <line x1="950" y1="1950" x2="950" y2="1980" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Set DO_03 to Maintenance -->
  <line x1="950" y1="2020" x2="950" y2="2050" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Maintenance to Wait 1s -->
  <line x1="950" y1="2090" x2="950" y2="2120" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Wait 1s to Reset DO_03 -->
  <line x1="950" y1="2160" x2="950" y2="2190" class="line" marker-end="url(#arrowhead)"/>
  
  <!-- Reset DO_03 to loop back -->
  <line x1="950" y1="2230" x2="950" y2="2300" class="line"/>
  <line x1="950" y1="2300" x2="1150" y2="2300" class="line"/>
  <line x1="1150" y1="2300" x2="1150" y2="410" class="line"/>
  
  <!-- Decision 3 NO to loop back -->
  <line x1="800" y1="1800" x2="750" y2="1800" class="line"/>
  <line x1="750" y1="1800" x2="750" y2="2400" class="line"/>
  <line x1="750" y1="2400" x2="1150" y2="2400" class="line"/>
  <line x1="1150" y1="2400" x2="1150" y2="410" class="line"/>
</svg>
